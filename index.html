<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박호영 개인 메모장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/screens.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/preview.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/markdown.css">
  <link rel="stylesheet" href="./assets/css/overlays.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script type="module" src="./assets/js/main.js"></script>
</head>
<body>
  <div id="lock-screen"><div class="lock-card">
    <div class="lock-logo">박호영<span>메모</span></div>
    <div class="lock-subtitle">박호영 개인 메모장</div>
    <div class="lock-input-wrap"><input type="password" class="lock-input" id="pw-input" placeholder="비밀번호 입력" autocomplete="current-password"></div>
    <button class="lock-btn" id="unlock-btn">잠금 해제</button><div class="lock-error" id="lock-error"></div>
    <div class="lock-hint">초기 비밀번호는 배포자 설정값을 사용해.</div><button class="lock-reset-btn" id="reset-btn">설정 초기화 (비밀번호를 잊었을 때)</button>
  </div></div>
  <div id="setup-screen"><div class="setup-card">
    <div class="setup-title">메모 설정</div>
    <div class="setup-desc">잠금 비밀번호를 변경할 수 있어.</div>
    <hr class="setup-divider">
    <div class="setup-group"><label class="setup-label" for="cfg-pw">새 비밀번호</label><input class="setup-input" id="cfg-pw" type="password" placeholder="새 비밀번호 입력" autocomplete="new-password"></div>
    <button class="setup-btn" id="setup-save-btn">변경하기</button>
  </div></div>
  <div id="app">
    <div class="header"><div class="header-logo">박호영<span>메모</span></div><div class="header-breadcrumb" id="breadcrumb">파일을 선택하세요</div><div class="header-actions"><span class="save-status" id="save-status"></span><button class="header-btn" id="search-btn" title="검색">🔍</button><button class="header-btn" id="theme-btn" title="테마 전환">🌙</button><button class="header-btn" id="settings-btn" title="설정">⚙️</button><button class="header-save-btn" id="save-btn"><span id="save-icon">💾</span> 저장</button></div></div>
    <div class="body">
      <aside class="sidebar"><div class="sidebar-section"><span>파일</span><div class="sidebar-actions"><button class="sidebar-action-btn" id="new-folder-btn" title="새 폴더">📁</button><button class="sidebar-action-btn" id="new-note-btn" title="새 메모">📄</button><button class="sidebar-action-btn" id="trash-btn" title="휴지통">🗑</button></div></div><div class="file-tree" id="file-tree"></div><div class="sidebar-section sidebar-section-bottom">태그</div><div class="tag-filter" id="tag-filter"></div><button class="sidebar-new-btn" id="new-note-footer-btn">+ 새 메모</button></aside>
      <main class="editor-area">
        <div class="empty-state" id="empty-state"><div class="empty-icon">📝</div><div class="empty-title">메모를 선택하세요</div><div class="empty-desc">왼쪽에서 메모를 클릭하거나 새 메모를 만들어보세요</div><button class="empty-action" id="new-note-empty-btn">+ 새 메모 만들기</button></div>
        <div id="editor-container"><div class="editor-tabs"><button class="editor-tab active" data-tab="edit">✏️ 편집</button><button class="editor-tab" data-tab="preview">👁 미리보기</button><button class="editor-tab" data-tab="split">⬜ 분할</button></div><div class="editor-content" id="editor-content"><textarea class="code-editor" id="code-editor" spellcheck="false"></textarea><div class="preview-area" id="preview-area"></div></div><div class="meta-bar"><span class="meta-label">태그:</span><div class="meta-tags" id="meta-tags"></div><input class="meta-tag-input" id="tag-input" placeholder="태그 입력 후 Enter" maxlength="20"></div></div>
      </main>
      <aside class="toc-panel"><div class="toc-header">목차</div><div class="toc-list" id="toc-list"><div class="toc-empty">메모를 열면 목차가 표시돼요</div></div></aside>
    </div>
  </div>
  <div class="search-overlay" id="search-overlay"><div class="search-modal"><div class="search-input-wrap"><span class="search-icon">🔍</span><input class="search-input" id="search-input" placeholder="메모 검색..."><span class="search-kbd">ESC</span></div><div class="search-results" id="search-results"><div class="search-empty">검색어를 입력하세요</div></div></div></div>
  <div class="modal-overlay" id="new-file-modal"><div class="modal-box"><div class="modal-title">새 메모</div><input class="modal-input" id="new-file-name" placeholder="파일명 (예: binary-search)"><div class="modal-hint">notes/<span id="file-path-preview">파일명</span>.md 에 저장돼</div><select class="modal-input" id="new-file-folder"></select><div class="modal-actions"><button class="modal-cancel" data-close-modal="new-file-modal">취소</button><button class="modal-confirm" id="new-file-confirm">만들기</button></div></div></div>
  <div class="modal-overlay" id="new-folder-modal"><div class="modal-box"><div class="modal-title">새 폴더</div><input class="modal-input" id="new-folder-name" placeholder="폴더명 (예: 알고리즘)"><div class="modal-hint">notes/<span id="folder-path-preview">폴더명</span>/ 로 만들어져</div><div class="modal-actions"><button class="modal-cancel" data-close-modal="new-folder-modal">취소</button><button class="modal-confirm" id="new-folder-confirm">만들기</button></div></div></div>
  <div class="toast-container" id="toast-container"></div>
  <div class="trash-overlay" id="trash-overlay">
    <div class="trash-modal">
      <div class="trash-header">
        <span>🗑 휴지통</span>
        <button class="trash-close-btn" id="trash-close-btn">✕</button>
      </div>
      <div class="trash-list" id="trash-list">
        <div class="trash-empty">휴지통이 비어있어요</div>
      </div>
    </div>
  </div>
</body>
</html>
